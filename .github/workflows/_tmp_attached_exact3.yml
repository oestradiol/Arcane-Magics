name: temporary exact rebirth validation 3

on:
  push:
    paths:
      - '.github/workflows/_tmp_attached_exact3.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate exact candidate and publish rebuild branch
        shell: bash
        run: |
          set -euo pipefail
          EXPECT='734444c515a8f22b6c201bdd348a645e9ccc07c5a3077107df8cf8afdcee83fa'
          test -f .transfer/rebirth.zip
          GOT="$(sha256sum .transfer/rebirth.zip | awk '{print $1}')"
          echo "attached_payload_sha256=$GOT"
          test "$GOT" = "$EXPECT"
          unzip -tq .transfer/rebirth.zip >/dev/null
          rm -rf /tmp/rebirth-new
          mkdir -p /tmp/rebirth-new
          unzip -q .transfer/rebirth.zip -d /tmp/rebirth-new
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rebirth-new/. .
          python -m pip install --upgrade pip pytest >/dev/null
          python tools/conformance.py
          python -m pytest -q
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          git config user.name 'Venus-Minerva Rebirth CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'rebuild: unified meta-theory and executable substrate'
          git push --force origin HEAD:refs/heads/rebuild/unified-metatheory-2026-09-01
