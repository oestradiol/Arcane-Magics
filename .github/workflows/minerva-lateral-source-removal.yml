name: Minerva lateral source removal

on:
  workflow_dispatch:
  push:
    branches:
      - split/minerva
    paths:
      - kernel/development/LATERAL_EPISODE_1_INTERNALIZED_STATE.json
      - autonomy/evidence/lateral/169/episode-1-opaque-holdout.json
      - scripts/audit_lateral_source_removal.py
      - kernel/runtime/token_knn.py
      - .github/workflows/minerva-lateral-source-removal.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: minerva-lateral-source-removal
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: split/minerva
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Isolated source-removal audit
        run: |
          python scripts/audit_lateral_source_removal.py \
            --state kernel/development/LATERAL_EPISODE_1_INTERNALIZED_STATE.json \
            --faces autonomy/evidence/lateral/169/episode-1-opaque-holdout.json \
            --proposal autonomy/evidence/lateral/169/episode-1-proposal.json \
            --output kernel/development/LATERAL_EPISODE_1_SOURCE_REMOVAL_RESULT.json

      - name: Persist source-removal result
        run: |
          git config user.name 'Minerva Internalizer evaluator'
          git config user.email 'actions@users.noreply.github.com'
          git add kernel/development/LATERAL_EPISODE_1_SOURCE_REMOVAL_RESULT.json
          if git diff --cached --quiet; then
            echo 'No source-removal result change.'
            exit 0
          fi
          git commit -m 'internalizer: verify lateral episode source removal'
          git push origin HEAD:split/minerva
