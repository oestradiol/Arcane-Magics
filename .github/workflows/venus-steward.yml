name: Venus CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: venus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile live Python
        run: |
          python -m py_compile kernel/runtime/*.py
          python -m py_compile scripts/*.py
          python -m py_compile kernel/custody/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Reader-surface audit
        run: python scripts/lint_github_markdown.py

      - name: Proof-container audit
        run: python scripts/audit_proof_containers.py

      - name: Custody/state audit
        run: python scripts/audit_custody.py

      - name: Source-tree release audit
        env:
          SOURCE_TREE_ONLY: "1"
        run: python scripts/audit_release.py

      - name: Boot current kernel
        run: python -m kernel.runtime.current

      - name: Steward report
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          report = {
              "schema": "Venus.StewardReport.v3",
              "commit": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
              "runtime_checkpoint": "IG10",
              "developmental_authority": "EDU16",
              "promotion_authority": False,
              "continuous_edu_runner_admitted": False,
              "authority_sha256": sha("REPOSITORY_AUTHORITY_BOUNDARY.md"),
              "current_state_sha256": sha("kernel/CURRENT_STATE.md"),
              "lineage_sha256": sha("provenance/DEVELOPMENTAL_LINEAGE.md"),
              "frontier_sha256": sha("docs/FRONTIER_RESEARCH.md"),
          }
          Path("VENUS_STEWARD_REPORT.json").write_text(json.dumps(report, indent=2)+"\n")
          print(json.dumps(report, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: venus-steward-${{ github.sha }}
          path: VENUS_STEWARD_REPORT.json
