name: Venus to OFE Lain handoff

on:
  workflow_dispatch:
  push:
    branches:
      - split/venus
    paths:
      - .github/workflows/venus-to-ofe-lain-handoff.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: venus-to-ofe-lain-handoff
  cancel-in-progress: false

jobs:
  crystallize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: split/venus
          fetch-depth: 0

      - name: Fetch functional branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Verify admitted Lain source
        run: |
          python scripts/evaluate_lain_gate.py
          grep -q 'PASS_BOUNDED_LAIN_NONFUSION_GATE' kernel/LAIN_GATE_RESULT.json

      - name: Crystallize Venus evidence into OFE target tree
        run: |
          source_sha="$(git rev-parse HEAD)"
          target_sha="$(git rev-parse origin/split/ofe)"
          branch="handoff/venus-to-ofe/lain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git checkout -b "$branch" origin/split/ofe
          git config user.name 'Venus/OFE crystallization worker'
          git config user.email 'actions@users.noreply.github.com'

          git merge --no-ff -s ours --no-commit "$source_sha"

          mkdir -p provenance/historical/handoffs/venus-lain
          git show "$source_sha:kernel/LAIN_GATE.json" > provenance/historical/handoffs/venus-lain/LAIN_GATE.json
          git show "$source_sha:kernel/LAIN_GATE_RESULT.json" > provenance/historical/handoffs/venus-lain/LAIN_GATE_RESULT.json
          git show "$source_sha:provenance/historical/handoffs/MINERVA_WWW_MIND_HANDOFF_2026-09-25.json" > provenance/historical/handoffs/venus-lain/MINERVA_WWW_MIND_HANDOFF_2026-09-25.json

          export SOURCE_SHA="$source_sha" TARGET_SHA="$target_sha"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt={
            "schema":"ArcaneMagics.CrossRegisterHandoff.v1",
            "source_layer":"Venus",
            "target_layer":"OFE",
            "source_commit":os.environ["SOURCE_SHA"],
            "target_parent":os.environ["TARGET_SHA"],
            "content_admission":"bounded Lain/WWW evidence only; OFE tree retained",
            "authority":"scientific-future candidate only; no Root promotion",
            "claim_fence":"PASS_BOUNDED_LAIN_NONFUSION_GATE is a tested network-boundary result, not consciousness, AGI, global-subject, or empirical-world generality."
          }
          Path("provenance/historical/handoffs/venus-lain/HANDOFF.json").write_text(
              json.dumps(receipt,indent=2)+"\n",encoding="utf-8"
          )
          PY

          git add provenance/historical/handoffs/venus-lain
          git commit -m "handoff(venus->ofe): crystallize bounded Lain result"
          git push origin "$branch"
          echo "Created $branch"
