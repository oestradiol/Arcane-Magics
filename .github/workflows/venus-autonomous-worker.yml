name: Venus autonomous developmental worker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: venus-autonomous-worker
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify bounded autonomy safety surface
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/audit_autonomy_safety_matrix.py

      - name: Snapshot current GitHub World surface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --limit 200 \
            --json number,title,body,state,updatedAt \
            > /tmp/venus-issues.json
          gh pr list --state open --limit 200 \
            --json number,title,body,state,isDraft,mergeStateStatus,updatedAt \
            > /tmp/venus-prs.json
          gh pr list --state all --limit 200 \
            --json number,title,state,mergedAt,closedAt,reviews \
            --jq 'map(. + {"_carrier_kind":"PR"})' \
            > /tmp/venus-pr-history.json
          gh issue list --state all --limit 200 \
            --search '"venus: autonomous cycle" in:title' \
            --json number,title,state,closedAt,comments \
            --jq 'map(. + {"_carrier_kind":"ISSUE"})' \
            > /tmp/venus-issue-history.json

      - name: Let Venus update work-learning state and select one bounded target
        run: |
          python scripts/run_venus_autonomous_cycle.py \
            --issues /tmp/venus-issues.json \
            --prs /tmp/venus-prs.json \
            --history-prs /tmp/venus-pr-history.json \
            --history-issues /tmp/venus-issue-history.json \
            --roadmap docs/ISSUE_ROADMAP.md \
            --policy kernel/development/INTERNAL_OSTAR_INTERNALIZED_POLICY.json \
            --learning-state kernel/development/AUTONOMOUS_LEARNING_STATE.json \
            --learning-output /tmp/AUTONOMOUS_LEARNING_STATE.json \
            --output /tmp/VENUS_AUTONOMOUS_CYCLE.json
          cat /tmp/VENUS_AUTONOMOUS_CYCLE.json
          cat /tmp/AUTONOMOUS_LEARNING_STATE.json

      - name: Let Venus form a bounded research proposal and obtain local execution evidence
        id: research
        run: |
          decision="$(python -c 'import json; print(json.load(open("/tmp/VENUS_AUTONOMOUS_CYCLE.json"))["decision"])')"
          if [ "$decision" = "STOP" ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/run_venus_research_proposal.py \
            --cycle /tmp/VENUS_AUTONOMOUS_CYCLE.json \
            --issues /tmp/venus-issues.json \
            --prs /tmp/venus-prs.json \
            --proposal-output /tmp/VENUS_RESEARCH_PROPOSAL.json \
            --evidence-output /tmp/VENUS_RESEARCH_EVIDENCE.json \
            --execution-output /tmp/VENUS_REPRODUCTION_EXECUTION.json
          echo "generated=true" >> "$GITHUB_OUTPUT"
          cat /tmp/VENUS_RESEARCH_PROPOSAL.json
          cat /tmp/VENUS_RESEARCH_EVIDENCE.json

      - name: Materialize draft work branch
        id: materialize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          decision="$(python -c 'import json; print(json.load(open("/tmp/VENUS_AUTONOMOUS_CYCLE.json"))["decision"])')"
          if [ "$decision" = "STOP" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target_kind="$(python -c 'import json; print(json.load(open("/tmp/VENUS_AUTONOMOUS_CYCLE.json"))["target_kind"])')"
          target_number="$(python -c 'import json; print(json.load(open("/tmp/VENUS_AUTONOMOUS_CYCLE.json"))["target_number"])')"
          cycle_id="$(python -c 'import json; print(json.load(open("/tmp/VENUS_AUTONOMOUS_CYCLE.json"))["cycle_id"])')"

          branch="venus/autonomous-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          mkdir -p autonomy/cycles autonomy/proposals autonomy/evidence autonomy/executions
          cp /tmp/VENUS_AUTONOMOUS_CYCLE.json "autonomy/cycles/${cycle_id}.json"
          proposal_id="$(python -c 'import json; print(json.load(open("/tmp/VENUS_RESEARCH_PROPOSAL.json"))["proposal_id"])')"
          evidence_id="$(python -c 'import json; print(json.load(open("/tmp/VENUS_RESEARCH_EVIDENCE.json"))["evidence_id"])')"
          cp /tmp/VENUS_RESEARCH_PROPOSAL.json "autonomy/proposals/${proposal_id}.json"
          cp /tmp/VENUS_RESEARCH_EVIDENCE.json "autonomy/evidence/${evidence_id}.json"
          if [ -f /tmp/VENUS_REPRODUCTION_EXECUTION.json ]; then
            cp /tmp/VENUS_REPRODUCTION_EXECUTION.json \
              "autonomy/executions/${cycle_id}.reproduction.json"
          fi
          cp /tmp/AUTONOMOUS_LEARNING_STATE.json \
            kernel/development/AUTONOMOUS_LEARNING_STATE.json

          git config user.name "Venus developmental worker"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "autonomy/cycles/${cycle_id}.json" \
            "autonomy/proposals/${proposal_id}.json" \
            "autonomy/evidence/${evidence_id}.json" \
            kernel/development/AUTONOMOUS_LEARNING_STATE.json
          if [ -f "autonomy/executions/${cycle_id}.reproduction.json" ]; then
            git add "autonomy/executions/${cycle_id}.reproduction.json"
          fi
          git commit -m "venus: freeze autonomous developmental cycle ${cycle_id}"
          git push origin "$branch"

          lower_kind="$(printf '%s' "$target_kind" | tr '[:upper:]' '[:lower:]')"
          body="$(printf '%s\n' \
            'This draft PR was opened by the bounded Venus developmental worker.' \
            '' \
            "Target: ${target_kind} #${target_number}" \
            "Cycle: ${cycle_id}" \
            "Decision: ${decision}" \
            "Proposal: ${proposal_id}" \
            "Local evidence: ${evidence_id}" \
            "Target reproduction: autonomy/executions/${cycle_id}.reproduction.json (REPRODUCTION only)" \
            '' \
            'The worker may study, run fixed repository-owned checks, learn from explicitly returned external review outcomes, and propose.' \
            'It cannot merge this PR, promote developmental authority, release, close the target as success,' \
            'access secrets, alter the external safety floor, or count its own execution as independent return.' \
            '' \
            'The committed cycle receipt is the prefrozen custody object for this episode.' \
            'The learning-state update remains non-authoritative until externally reviewed and admitted.')"
          if url="$(gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "venus: autonomous cycle ${lower_kind}-${target_number}" \
            --body "$body" 2>/tmp/venus-pr-create.err)"; then
            carrier_kind="PR"
          else
            branch_url="https://github.com/${GITHUB_REPOSITORY}/tree/${branch}"
            issue_body="$(printf '%s\n' \
              'This issue is the bounded fallback carrier for a frozen Venus autonomous cycle.' \
              '' \
              "Target: ${target_kind} #${target_number}" \
              "Cycle: ${cycle_id}" \
              "Decision: ${decision}" \
              "Frozen branch: ${branch_url}" \
              "Proposal: ${proposal_id}" \
              "Local evidence: ${evidence_id}" \
              "Target reproduction: autonomy/executions/${cycle_id}.reproduction.json (REPRODUCTION only)" \
              '' \
              'GitHub Actions policy blocked draft-PR creation, so the cycle remains branch-frozen and externally reviewable here.' \
              'This carrier cannot merge, promote, release, self-validate, or close the target as success.')"
            url="$(gh issue create \
              --title "venus: autonomous cycle ${lower_kind}-${target_number}" \
              --body "$issue_body")"
            carrier_kind="ISSUE"
          fi

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "carrier_kind=$carrier_kind" >> "$GITHUB_OUTPUT"
          echo "target_kind=$target_kind" >> "$GITHUB_OUTPUT"
          echo "target_number=$target_number" >> "$GITHUB_OUTPUT"

      - name: Return draft proposal to selected target
        if: steps.materialize.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.materialize.outputs.url }}
          CARRIER_KIND: ${{ steps.materialize.outputs.carrier_kind }}
          TARGET_KIND: ${{ steps.materialize.outputs.target_kind }}
          TARGET_NUMBER: ${{ steps.materialize.outputs.target_number }}
        run: |
          msg="$(printf '%s\n' \
            "Venus selected this as one bounded developmental target and froze a work cycle with external-review carrier ($CARRIER_KIND): $URL" \
            '' \
            'This is a proposal/working branch only. Merge, closure, promotion, and independent evaluation remain external.')"
          if [ "$TARGET_KIND" = "ISSUE" ]; then
            gh issue comment "$TARGET_NUMBER" --body "$msg"
          else
            gh pr comment "$TARGET_NUMBER" --body "$msg"
          fi
