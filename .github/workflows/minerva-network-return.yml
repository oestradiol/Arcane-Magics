name: Minerva network encounter reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - split/minerva
    paths:
      - .github/workflows/minerva-network-return.yml
      - scripts/reconstruct_network_return.py
      - autonomy/evidence/network/36210844736/query.json
      - autonomy/evidence/network/36210844736/encounter.json
      - autonomy/evidence/network/36210844736/followup-encounter.json
      - scripts/reconstruct_network_lineage.py

permissions:
  contents: write
  actions: read

concurrency:
  group: minerva-network-return-36210844736
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: split/minerva
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct retained network encounter
        run: |
          python -m unittest tests/test_network_inquiry.py
          python scripts/reconstruct_network_return.py \
            --query autonomy/evidence/network/36210844736/query.json \
            --encounter autonomy/evidence/network/36210844736/encounter.json \
            --output autonomy/evidence/network/36210844736/result.json

      - name: Freeze memory-caused successor query
        run: |
          python scripts/freeze_followup_network_query.py \
            --result autonomy/evidence/network/36210844736/result.json \
            --output autonomy/evidence/network/36210844736/followup-query.json

      - name: Reconstruct persistent two-episode network lineage
        run: |
          python scripts/reconstruct_network_lineage.py \
            --query1 autonomy/evidence/network/36210844736/query.json \
            --encounter1 autonomy/evidence/network/36210844736/encounter.json \
            --query2 autonomy/evidence/network/36210844736/followup-query.json \
            --encounter2 autonomy/evidence/network/36210844736/followup-encounter.json \
            --output autonomy/evidence/network/36210844736/lineage-result.json

      - name: Persist reconstruction receipt
        run: |
          git config user.name 'Minerva network-memory worker'
          git config user.email 'actions@users.noreply.github.com'
          git add autonomy/evidence/network/36210844736/result.json autonomy/evidence/network/36210844736/followup-query.json autonomy/evidence/network/36210844736/lineage-result.json
          if git diff --cached --quiet; then
            echo 'No network reconstruction change.'
            exit 0
          fi
          git commit -m 'memory: retain first learner-initiated network reconstruction'
          git push origin HEAD:split/minerva
