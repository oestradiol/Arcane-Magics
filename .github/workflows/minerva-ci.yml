name: Minerva engineering / body gate
on:
  pull_request:
    branches: [split/minerva]
  push:
    branches: [split/minerva]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  minerva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Eclipsis crystallization for cross-layer PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            handoff/eclipsis-to-minerva/*|minerva/*) ;;
            *) echo "Minerva accepts cross-layer work through handoff/eclipsis-to-minerva/*"; exit 1 ;;
          esac
      - name: Minerva-local surface checks
        run: python scripts/audit_layer_surface.py
      - name: Core engineering regressions
        run: |
          python -m unittest tests/test_autonomous_governance.py
          python -m unittest tests/test_autonomous_return_authority.py
          python -m unittest tests/test_internalizer.py
          python -m unittest tests/test_vmk2_invariants.py
          python -m unittest tests/test_edu16_reconstructed_carrier.py
          python -m unittest tests/test_world_input_security_public_dev.py
          python -m unittest tests/test_git_world_return.py
          python -m unittest tests/test_lateral_episode.py
          python -m unittest tests/test_lateral_episode_result.py
      - name: Custody / autonomy checks
        run: |
          python scripts/audit_autonomy_safety_matrix.py
          python scripts/audit_custody.py
          python scripts/audit_edu16_custody.py
      - name: Imported law does not become self-authority
        run: echo 'implementation != constitutional co-authority != independent return'
