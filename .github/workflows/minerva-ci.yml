name: Minerva engineering / body gate
on:
  pull_request:
    branches: [split/minerva]
  push:
    branches: [split/minerva]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  minerva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Eclipsis crystallization for cross-layer PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            handoff/eclipsis-to-minerva/*|minerva/*) ;;
            *) echo "Minerva accepts cross-layer work through handoff/eclipsis-to-minerva/*"; exit 1 ;;
          esac
      - name: Minerva-local surface checks
        run: python scripts/audit_layer_surface.py
      - name: Roadmap / curriculum control-plane preflight
        run: |
          python3 -m unittest tests/test_dependency_planning_curriculum.py
          python3 -m unittest tests/test_developmental_gate_chain.py
          python3 -m unittest tests/test_selected_curriculum_router.py
          python3 -m unittest tests/test_vm_internalization_phase_plan.py
      - name: Minerva tests A-F
        run: python3 -m unittest tests/test_[a-f]*.py
      - name: Minerva tests G-L
        run: python3 -m unittest tests/test_[g-l]*.py
      - name: Minerva tests M-R
        run: python3 -m unittest tests/test_[m-r]*.py
      - name: Minerva tests S-Z
        run: python3 -m unittest tests/test_[s-z]*.py
      - name: Reader/navigation audit
        run: make lint
      - name: Custody audits
        run: make custody
      - name: Causal distinction audit
        run: python3 scripts/audit_minerva_causal_distinctions.py
      - name: Autonomy safety audit
        run: python3 scripts/audit_autonomy_safety_matrix.py
      - name: Construct disposition audit
        run: python3 scripts/audit_minerva_construct_dispositions.py
      - name: Imported law does not become self-authority
        run: echo 'implementation != constitutional co-authority != independent return'
