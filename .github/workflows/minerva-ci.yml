name: Minerva engineering / body gate

on:
  pull_request:
    branches: [split/minerva]
  push:
    branches: [split/minerva]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  minerva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require Eclipsis crystallization for cross-layer PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            handoff/eclipsis-to-minerva/*|minerva/*) ;;
            *) echo "Minerva accepts cross-layer work through handoff/eclipsis-to-minerva/*"; exit 1 ;;
          esac

      - name: Engineering / developmental checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/audit_autonomy_safety_matrix.py
          python scripts/audit_custody.py
          python scripts/audit_edu16_custody.py
          grep -q 'Engineering' docs/LAYER_IDENTITY.md
          grep -q 'fixed relation != frozen self-model' docs/SELF_MODEL.md
          grep -q 'can inspect != can claim' docs/GLOBAL_REPOSITORY_OPERATION.md
