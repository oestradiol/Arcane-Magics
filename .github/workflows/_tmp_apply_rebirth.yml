name: temporary rebirth transfer

on:
  push:
    branches:
      - 'tmp/rebirth-transfer'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install nearest uploaded candidate on rebuild branch
        shell: bash
        run: |
          set -euo pipefail
          choose_payload() {
            for mode in p1 p2 p1p2 p2p1; do
              rm -f /tmp/candidate.zip
              case "$mode" in
                p1) cp .github/_tmp/rebirth.part1 /tmp/candidate.zip ;;
                p2) cp .github/_tmp/rebirth.part2 /tmp/candidate.zip ;;
                p1p2) cat .github/_tmp/rebirth.part1 .github/_tmp/rebirth.part2 > /tmp/candidate.zip ;;
                p2p1) cat .github/_tmp/rebirth.part2 .github/_tmp/rebirth.part1 > /tmp/candidate.zip ;;
              esac
              if unzip -tq /tmp/candidate.zip >/dev/null 2>&1; then
                echo "using valid uploaded baseline: $mode"
                return 0
              fi
            done
            exit 42
          }
          choose_payload
          rm -rf /tmp/rebirth-new
          mkdir -p /tmp/rebirth-new
          unzip -q /tmp/candidate.zip -d /tmp/rebirth-new
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rebirth-new/. .
          git config user.name 'Venus-Minerva Rebirth Transfer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'rebuild: stage executable meta-theory candidate'
          git push --force origin HEAD:refs/heads/rebuild/unified-metatheory-2026-09-01
