name: Pages · Root / Lain public instance

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/NOW_MAP.md'
      - 'docs/LAYER_IDENTITY.md'
      - 'docs/UI_META_THEORY.md'
      - 'docs/ROOT_CLOSURE_POINTER.md'
      - 'docs/CONVERSATION_CONSTRAINT_LEDGER_2026-09-25.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages_gate.outputs.ready }}
    steps:
      - name: Checkout routing layer
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch differentiated branch heads
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Build static Pages projection
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp -a site/. _site/
          python - <<'PY'
          import datetime, json, pathlib, subprocess

          layers = [
              {
                  'id': 'root',
                  'name': 'Root / The Machine',
                  'branch': 'main',
                  'axis': 'map / territory',
                  'role': 'Routing, cross-register memory, and the current map of local authorities.',
                  'boundary': 'map != territory',
                  'residual_title': 'Map / territory gap',
                  'residual': 'World or branch history may invalidate the current route without erasing the route that produced it.',
                  'residual_status': 'OPEN',
                  'reopening': 'handoff / merge memory -> revised Now Map',
              },
              {
                  'id': 'arcane',
                  'name': 'Arcane Magics',
                  'branch': 'split/arcane-magics',
                  'axis': 'past',
                  'role': 'Religion, inhabited symbolic memory, ritual, astrology, comparison, and reader release.',
                  'boundary': 'meaning != mechanism',
                  'residual_title': 'Meaning / mechanism separation',
                  'residual': 'Synchronicity, astrology, and symbolic efficacy may remain meaningful while statistical anomaly, predictive accuracy, or acausal mechanism stays separately unearned.',
                  'residual_status': 'OPEN',
                  'reopening': 'hostile reading / source removal / independent return / reader release',
              },
              {
                  'id': 'eclipsis',
                  'name': 'Eclipsis',
                  'branch': 'split/eclipsis',
                  'axis': 'spirit',
                  'role': 'Math & logics, local views, structural relations, and explicitly OPEN carrier bridges.',
                  'boundary': 'structural fit != physical identity',
                  'residual_title': 'Carrier / mechanism bridge',
                  'residual': 'Consciousness, quantum-gravity, and cosmological mappings remain OPEN where an explicit carrier, observable, or discriminator is still missing.',
                  'residual_status': 'WITHHOLD',
                  'reopening': 'carrier map / comparator / discriminator / failure consequence',
              },
              {
                  'id': 'minerva',
                  'name': 'Minerva',
                  'branch': 'split/minerva',
                  'axis': 'body',
                  'role': 'Developmental engineering, custody, evaluation, enactment, and corrigible self-reconstruction.',
                  'boundary': 'self-revision != self-authorization',
                  'residual_title': 'Re-derivation / independent evaluation',
                  'residual': 'The self-model relation must be re-derived under fresh consequence; bounded engineering success does not establish AGI or open-ended RSI.',
                  'residual_status': 'WITHHOLD',
                  'reopening': 'sealed or independent return / rollback / successor reconstruction',
              },
              {
                  'id': 'venus',
                  'name': 'Venus',
                  'branch': 'split/venus',
                  'axis': 'model',
                  'role': 'Self & World boundary, self-provenance, open bridges, and provenance-sensitive return.',
                  'boundary': 'model(Other) != Other',
                  'residual_title': 'Irreducible Other',
                  'residual': 'Self-provenance and prediction can never by themselves exhaust or mint the independent source of correction.',
                  'residual_status': 'OPEN',
                  'reopening': 'non-preauthored incidence / provenance-sensitive Residual / WITHHOLD',
              },
              {
                  'id': 'ofe',
                  'name': 'OFE',
                  'branch': 'split/ofe',
                  'axis': 'future',
                  'role': 'Scientific future: future-relative operational discrimination and lawful quotient refinement.',
                  'boundary': 'current future family F != all possible future tests',
                  'residual_title': 'Future-family refinement',
                  'residual': "A richer future family F' may separate states that the current quotient treats as equivalent.",
                  'residual_status': 'OPEN',
                  'reopening': 'new admissible future test / separating witness / quotient refinement',
              },
          ]

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          out = []
          for layer in layers:
              branch = layer['branch']
              ref = branch if branch == 'main' else f'origin/{branch}'
              item = dict(layer)
              item['commit'] = git('rev-parse', ref)
              item['url'] = f'https://github.com/oestradiol/Arcane-Magics/tree/{branch}'
              out.append(item)

          payload = {
              'schema': 'ArcaneMagics.PagesLayerSnapshot.v2',
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'repository': 'oestradiol/Arcane-Magics',
              'layers': out,
              'handoff_route': [
                  'split/arcane-magics',
                  'split/eclipsis',
                  'split/minerva',
                  'split/venus',
                  'split/ofe',
                  'main',
              ],
              'virtual': {
                  'name': 'World / Other',
                  'branch': None,
                  'role': 'independently returned consequence not exhausted by current carrier, map, or model',
              },
              'network': {
                  'name': 'NETWORK / WWW',
                  'role': 'carrier / relational medium; not World / Other and not a global subject',
              },
          }
          pathlib.Path('_site/data/layers.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Static integrity checks
        run: |
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          required = [
              Path('_site/index.html'),
              Path('_site/styles.css'),
              Path('_site/app.js'),
              Path('_site/404.html'),
              Path('_site/data/layers.json'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('missing Pages files: ' + ', '.join(missing))

          class P(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          html = Path('_site/index.html').read_text()
          P().feed(html)

          for invariant in [
              'map / territory',
              'World / Other',
              'NETWORK / WWW',
              'relation without fusion',
              'CURRENT PERSPECTIVE',
              'CANONICAL TRANSFORMATION',
              'OPEN / WITHHOLD',
          ]:
              if invariant not in html:
                  raise SystemExit(f'missing UI invariant: {invariant}')

          data = json.loads(Path('_site/data/layers.json').read_text())
          if data['schema'] != 'ArcaneMagics.PagesLayerSnapshot.v2':
              raise SystemExit('unexpected Pages snapshot schema')
          if len(data['layers']) != 6:
              raise SystemExit('expected exactly six Git layers')
          if data['virtual']['branch'] is not None:
              raise SystemExit('World / Other must not be rendered as a Git branch')
          for layer in data['layers']:
              for field in ['boundary', 'residual', 'reopening', 'commit', 'url']:
                  if not layer.get(field):
                      raise SystemExit(f'missing {field} for {layer["id"]}')
          PY

      - name: Configure / enable Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Record Pages deployment gate
        id: pages_gate
        if: always()
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
        run: |
          if [ "$PAGES_OUTCOME" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages external-gate receipt
        if: steps.pages.outcome != 'success'
        run: |
          echo 'Static Root/Lain projection validated and packaged.'
          echo 'GitHub Pages service is not enabled/configurable by this Actions token.'
          echo 'Deployment remains an external repository-setting gate; build correctness is preserved.'

  deploy:
    needs: build
    if: needs.build.outputs.pages_configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
