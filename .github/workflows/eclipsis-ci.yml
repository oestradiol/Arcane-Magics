name: Eclipsis math / logic / spirit gate

on:
  pull_request:
    branches: [split/eclipsis]
  push:
    branches: [split/eclipsis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eclipsis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require Arcane crystallization for cross-layer PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            handoff/arcane-to-eclipsis/*|eclipsis/*) ;;
            *) echo "Eclipsis accepts cross-layer work through handoff/arcane-to-eclipsis/*"; exit 1 ;;
          esac

      - name: Structural / logical checks
        run: |
          python scripts/audit_causal_distinctions.py
          python scripts/audit_construct_dispositions.py
          python scripts/lint_github_markdown.py
          grep -q 'Math & logics' docs/LAYER_IDENTITY.md
          grep -q 'structural fit' REPOSITORY_AUTHORITY_BOUNDARY.md

      - name: Build Eclipsis monograph
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
          cd monographs/02_ECLIPSIS
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
