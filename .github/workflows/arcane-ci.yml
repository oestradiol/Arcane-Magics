name: Arcane symbolic / comparative CI
on:
  pull_request:
    branches: [split/arcane-magics]
  push:
    branches: [split/arcane-magics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Arcane-local symbolic/provenance checks
        run: python scripts/audit_layer_surface.py
      - name: Build Arcane monograph
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
          cd monographs/03_ARCANE_MAGICS
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
      - name: Anti-scripture fence
        run: echo 'meaning != mechanism != source independence'
