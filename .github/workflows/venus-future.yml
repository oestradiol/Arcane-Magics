name: Venus Self / World model gate

on:
  pull_request:
    branches: [split/venus]
  push:
    branches: [split/venus]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  model-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Minerva crystallization for cross-layer PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            handoff/minerva-to-venus/*|venus/*) ;;
            *) echo "Venus accepts cross-layer work through handoff/minerva-to-venus/*"; exit 1 ;;
          esac

      - name: Self / World boundary checks
        run: |
          test -f kernel/VENUS_INCIDENCE_LAW.tex
          test -f provenance/historical/BRANCH_MEMORY.md
          grep -q 'Self & World' docs/LAYER_IDENTITY.md
          grep -q 'model(Other) != Other' README.md
          grep -q 'Self provenance' docs/SCIENTIFIC_FUTURE.md

      - name: Build Monograph V
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
          cd monographs/05_VENUS
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null

      - name: Model is not World
        run: echo 'SELF_WORLD_MODEL != World / Other != scientific future verdict'
