name: Venus · Self / World model gate

on:
  pull_request:
    branches: [split/venus]
  push:
    branches: [split/venus]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  venus-model-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require Minerva crystallization for cross-layer PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            handoff/minerva-to-venus/*|venus/*) ;;
            *) echo "Venus accepts cross-layer work through handoff/minerva-to-venus/*"; exit 1 ;;
          esac

      - name: Self / World boundary checks
        run: make boundary

      - name: Build Monograph V
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
          make paper

      - name: Noncollapse receipt
        run: |
          printf '%s\n'             'model(World) != World'             'model(Other) != Other'             'prediction != return'             'NETWORK / WWW != World / Other'
